name: Build APK
# 你不需要在电脑上装 Android Studio。
# 把代码传到 GitHub 后，这个文件会让 GitHub 的服务器帮你编译出 APK。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 显示 Android SDK 信息（排错用）
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true
      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeLedger-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
